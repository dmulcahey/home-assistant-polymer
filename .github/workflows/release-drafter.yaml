name: Release Drafter

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      # write permission for contents is required to create a github release
      contents: write
      # write permission for pull-requests is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@c345907820e0396f6f44bcfd9ac4763325f8feb0 # v7.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
